# Render Blueprint for the Django API (https://render.com/docs/blueprint-spec).
# The React frontend is deployed separately as a static site (see README).
services:
  - type: web
    name: weather-truck-routing-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker with threads so the in-process cache is shared by every request;
    # requests mostly wait on TomTom/Open-Meteo, so threads give the concurrency.
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 8 --timeout 90 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: TOMTOM_API_KEY
        sync: false
      # The deployed frontend origin, e.g. https://weather-truck-routing.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
